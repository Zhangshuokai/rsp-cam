<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef3f9" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f72d6'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif'%3E0%3C/text%3E%3C/svg%3E" />
    <title>编程零基础起步 · 从函数到回调（先修课）</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // 用 Live Server / 双击打开时，Vite 源码无法直接运行：自动跳到同级成品 ../index.html。
      // Vite 开发服务器会提供 /@vite/client，因此 npm run dev 下保持不跳转。
      (function () {
        if (!document.querySelector('script[src="/src/main.jsx"]')) return;
        fetch("/@vite/client", { cache: "no-store" })
          .then(function (r) { if (!r.ok) location.replace("../index.html"); })
          .catch(function () { location.replace("../index.html"); });
      })();
    </script>
  </body>
</html>
