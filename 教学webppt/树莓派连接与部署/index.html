# 需要 root（账号不在 NOPASSWD，必须显式加 --sudo）

# 上传并执行脚本（自动放到 /tmp/kilo-run.sh）

# 只上传文件、不执行（SFTP；不做 ~ 展开，远端写绝对路径）

# 它替代的手敲动作：
